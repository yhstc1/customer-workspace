<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>客户管理平台</title>
    <link rel="stylesheet" href="./static/css/style.css?v=20260823">
    <link rel="stylesheet" href="./static/css/mobile.css">
    <script>
        // 由服务端实时注入的静态资源版本号（基于关键文件 mtime 哈希），供 JS 拼接带 ?v= 的资源 URL。
        // 改文件保存即变化 → 浏览器缓存自动失效，无需手动 bump 版本号。
        window.STATIC_VER = "20260823h";
        // ===== 静态托管版后端地址（FC 函数）=====
        // 前端部署在免费静态托管，业务 API 全部走 FC；FC 返回 JSON 给 JS 读，不受 attachment 影响。
        window.API_BASE = "https://crm-api-fc-nrfocbaaxv.cn-hangzhou.fcapp.run";
        // 拦截原生 fetch：相对路径（/api/...、/m 等）自动拼上 API_BASE
        (function () {
            const _origFetch = window.fetch;
            window.fetch = function (input, init) {
                if (typeof input === 'string' && input.indexOf('/') === 0) {
                    input = window.API_BASE + input;
                }
                return _origFetch(input, init);
            };
        })();
        (function () {
            try {
                var t = localStorage.getItem('mTheme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
</head>
<body class="mobile-body">
    <!-- 顶部状态栏 -->
    <header class="mobile-header" id="mobileHeader">
        <a class="mobile-header-btn" id="mHeaderBack" onclick="goBack()" style="display:none;text-decoration:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <a class="mobile-header-btn" id="mHeaderClose" onclick="editPageCancel()" style="display:none;text-decoration:none;" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </a>
        <div class="m-header-title-group" style="display:flex;align-items:center;gap:6px;min-width:0;flex:1;">
            <div class="mobile-header-title" id="pageTitle" style="flex:0 1 auto;min-width:0;">客户管理平台</div>
        </div>
        <a class="mobile-header-btn" id="mHeaderSave" onclick="editPageSave()" style="display:none;text-decoration:none;" aria-label="保存">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </a>
        <a class="mobile-header-btn" id="mHeaderSettings" onclick="showTopMenu()" style="text-decoration:none;" aria-label="更多">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
            </svg>
        </a>
    </header>

    <!-- 顶栏连续磨砂遮罩（列表首页 / 地图页共用，高度由 body 类驱动） -->
    <div id="mHeaderVeil"></div>

    <!-- 内容区域 -->
    <main class="mobile-content" id="pageContent">
    </main>

    <!-- 底部 Tab 导航（顺序：看板 / 事项 / 业务 / 客户 / 地图） -->
    <nav class="mobile-tabbar">
        <a class="tab-item active" data-page="kanban" onclick="switchPage('kanban')">
            <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
            <span class="tab-label">看板</span>
        </a>
        <a class="tab-item" data-page="tasks" onclick="switchPage('tasks')">
            <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg></span>
            <span class="tab-label">事项</span>
        </a>
        <a class="tab-item" data-page="business" onclick="switchPage('business')">
            <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></span>
            <span class="tab-label">业务</span>
        </a>
        <a class="tab-item" data-page="customers" onclick="switchPage('customers')">
            <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9.5" cy="7.5" rx="3.5" ry="4"/><path d="M1 21v-2a6 6 0 0 1 6-6h5a6 6 0 0 1 6 6v2"/><path d="M17.5 9.5a3 3 0 1 0 0-6"/><path d="M23 21v-1a4.5 4.5 0 0 0-3.5-4.33"/></svg></span>
            <span class="tab-label">客户</span>
        </a>
        <a class="tab-item" data-page="map" onclick="switchPage('map')">
            <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg></span>
            <span class="tab-label">地图</span>
        </a>
    </nav>

    <script src="./static/js/app.js?v=20260823h"></script>
    <script src="./static/js/mobile.js"></script>
    <script>
        // 纯账号密码登录：后端基于 session cookie 认证，前端以 /api/me 返回为准判断是否登录。
        (async function() {
            // 先检查登录态：/api/me 返回 200 且含 user 即已登录
            let me = null;
            try {
                const r = await fetch('/api/me', { method: 'GET', credentials: 'include' });
                if (r.ok) me = await r.json().catch(function() { return null; });
            } catch (e) {}
            if (me && me.user) {
                // 已登录：直接渲染首页并后台预取数据
                switchPage('kanban');
                if (window.preloadAllData) preloadAllData();
                return;
            }
            // 未登录：不加载数据，直接弹出密码登录浮层；登录成功后由 showH5Login 触发加载
            if (typeof window.showH5Login === 'function') {
                window.showH5Login('请输入手机号和密码登录');
            }
        })();
    </script>
</body>
</html>
