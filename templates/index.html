<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作空间 - 仪表盘</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🏢 客户工作空间</div>
        <ul class="navbar-nav">
            <li><a href="/">📊 仪表盘</a></li>
            <li><a href="/customers">👥 客户管理</a></li>
            <li><a href="/business">💼 业务</a></li>
            <li><a href="/map">🗺️ 地图视图</a></li>
            <li><a href="/tasks">📝 事项看板</a></li>
            <li><a href="/reports">📊 每日报告</a></li>
            <li><a href="/settings">⚙️ 设置</a></li>
            <li><a href="/logout">🚪 退出</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="stat-customers">-</div>
                <div class="stat-label">客户总数</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="stat-pending">-</div>
                <div class="stat-label">待处理事项</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-icon">⏰</div>
                <div class="stat-value" id="stat-overdue">-</div>
                <div class="stat-label">逾期事项</div>
            </div>
            <div class="stat-card success">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="stat-completion">-</div>
                <div class="stat-label">完成率</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="card">
                <div class="card-title">
                    <span>📌 最近事项</span>
                    <a href="/tasks" class="btn btn-outline btn-sm">查看全部</a>
                </div>
                <div id="recentTasks">
                    <div class="empty-state"><div class="icon">⏳</div><div>加载中...</div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>⚡ 快捷操作</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <a href="/customers" class="btn btn-primary" style="justify-content: center; padding: 12px;">
                        👥 管理客户
                    </a>
                    <a href="/map" class="btn btn-success" style="justify-content: center; padding: 12px;">
                        🗺️ 查看附近客户地图
                    </a>
                    <button class="btn btn-warning" style="justify-content: center; padding: 12px;" onclick="generateReport()">
                        📊 生成今日报告
                    </button>
                    <a href="/tasks" class="btn btn-outline" style="justify-content: center; padding: 12px;">
                        📝 查看事项看板
                    </a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>📈 优先级分布</span>
            </div>
            <div id="priorityDist" style="display: flex; gap: 20px; flex-wrap: wrap;"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const data = await api('/api/dashboard');
                document.getElementById('stat-customers').textContent = data.total_customers;
                document.getElementById('stat-pending').textContent = data.pending;
                document.getElementById('stat-overdue').textContent = data.overdue;
                document.getElementById('stat-completion').textContent = data.completion_rate + '%';

                // 最近事项
                const recentEl = document.getElementById('recentTasks');
                if (data.recent_tasks.length === 0) {
                    recentEl.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无事项</div></div>';
                } else {
                    recentEl.innerHTML = '<table><thead><tr><th>客户</th><th>事项</th><th>状态</th><th>截止</th></tr></thead><tbody>' +
                        data.recent_tasks.map(t => `
                            <tr>
                                <td><strong>${t.customer_name}</strong></td>
                                <td>${t.title}</td>
                                <td><span class="badge status-${t.status}">${t.status}</span></td>
                                <td style="color: ${isOverdue(t.due_date, t.status) ? '#e74c3c' : '#888'}">${formatDate(t.due_date)}</td>
                            </tr>
                        `).join('') + '</tbody></table>';
                }

                // 优先级分布
                const distEl = document.getElementById('priorityDist');
                if (data.priority_dist.length === 0) {
                    distEl.innerHTML = '<div style="color: #888;">暂无未完成事项 🎉</div>';
                } else {
                    const colors = { '高': '#e74c3c', '中': '#f39c12', '低': '#27ae60' };
                    distEl.innerHTML = data.priority_dist.map(p => {
                        const pct = (p.count / data.priority_dist.reduce((s, x) => s + x.count, 0) * 100).toFixed(0);
                        return `
                            <div style="flex: 1; min-width: 150px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                    <span class="badge priority-${p.priority}">${p.priority}优先级</span>
                                    <strong>${p.count} 个</strong>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${pct}%; background: ${colors[p.priority]};">${pct}%</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                showToast('加载失败: ' + e.message, 'error');
            }
        }

        async function generateReport() {
            try {
                showToast('正在生成报告...', '');
                const data = await api('/api/report/generate', { method: 'POST' });
                showToast('报告已生成！', 'success');
                setTimeout(() => window.open(data.url, '_blank'), 500);
            } catch (e) {
                showToast('生成失败: ' + e.message, 'error');
            }
        }

        loadDashboard();
    </script>
</body>
</html>
