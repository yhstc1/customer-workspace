<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号设置</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ static_ver }}">
    <style>
        .account-card { max-width: 520px; margin: 0 auto; }
        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid #eee;
        }
        .info-row .label { color: #888; font-size: 14px; }
        .info-row .value { font-size: 15px; font-weight: 600; color: #333; letter-spacing: 1px; }
        .masked { font-size: 18px; color: #333; }
        .pwd-form { margin-top: 28px; }
        .pwd-form h3 { font-size: 16px; color: #333; margin-bottom: 16px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
        .field input {
            width: 100%; padding: 11px 13px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; outline: none; transition: border-color .2s;
        }
        .field input:focus { border-color: #007FFF; }
        .btn-save {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #007FFF; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
        }
        .btn-save:disabled { opacity: .6; cursor: default; }
        .msg { font-size: 14px; margin-top: 12px; min-height: 20px; }
        .msg.ok { color: #2e7d32; }
        .msg.err { color: #c0392b; }
        .section-gap { margin-top: 32px; text-align: center; }
        .badge { background: #007FFF; color: #fff; border-radius: 10px; padding: 2px 9px; font-size: 13px; font-weight: 500; margin-left: 6px; }
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .p-phone { font-size: 15px; font-weight: 600; color: #333; letter-spacing: 1px; }
        .p-time { font-size: 12px; color: #999; margin-top: 3px; }
        .p-actions { display: flex; gap: 8px; }
        .btn-approve { padding: 7px 16px; border: none; border-radius: 7px; background: #2e7d32; color: #fff; font-size: 14px; cursor: pointer; }
        .btn-approve:hover { opacity: .9; }
        .btn-reject { padding: 7px 16px; border: none; border-radius: 7px; background: #e0e0e0; color: #555; font-size: 14px; cursor: pointer; }
        .btn-reject:hover { background: #d5d5d5; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="16" rx="2"/><path d="M2 9h20"/><path d="M12 9v10"/>
            </svg>
            客户管理平台
        </div>
        <nav class="sidebar-nav">
            <a href="/customers" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><ellipse cx="9.5" cy="7.5" rx="3.5" ry="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M1 21v-2a6 6 0 0 1 6-6h5a6 6 0 0 1 6 6v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 9.5a3 3 0 1 0 0-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M23 21v-1a4.5 4.5 0 0 0-3.5-4.33" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nav-label">客户管理</span></a>
            <a href="/business" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="2" y="7" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nav-label">业务</span></a>
            <a href="/map" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="nav-label">地图视图</span></a>
            <a href="/tasks" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="nav-label">事项看板</span></a>
            <a href="/settings" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="nav-label">设置</span></a>
            <div class="sidebar-spacer"></div>
            <a href="/logout" class="nav-item nav-logout"><span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="16 17 21 12 16 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="nav-label">退出登录</span></a>
        </nav>
    </aside>

    <div class="container">
        <div class="card account-card">
            <h2 style="margin-bottom: 8px;">账号设置</h2>
            <p style="color:#999; font-size:13px; margin-bottom: 18px;">仅你本人可见，客户资料彼此隔离</p>

            <div class="info-row">
                <span class="label">用户名（手机号）</span>
                <span class="value" id="username">—</span>
            </div>
            <div class="info-row">
                <span class="label">当前密码</span>
                <span class="value masked">••••••</span>
            </div>

            <div class="pwd-form">
                <h3>修改密码</h3>
                <div class="field">
                    <label for="oldPwd">当前密码</label>
                    <input type="password" id="oldPwd" placeholder="请输入当前密码" autocomplete="current-password">
                </div>
                <div class="field">
                    <label for="newPwd">新密码（至少 6 位）</label>
                    <input type="password" id="newPwd" placeholder="请输入新密码" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirmPwd">确认新密码</label>
                    <input type="password" id="confirmPwd" placeholder="再次输入新密码" autocomplete="new-password">
                </div>
                <button class="btn-save" id="saveBtn" onclick="changePassword()">保存修改</button>
                <div class="msg" id="msg"></div>
            </div>

            <div class="section-gap">
                <a href="/logout" class="btn btn-outline">🚪 退出登录</a>
            </div>
        </div>

        <!-- 管理员：注册审核面板 -->
        <div class="card account-card" id="adminPanel" style="display:none; margin-top: 24px;">
            <h2 style="margin-bottom: 8px;">注册审核 <span id="pendingCount" class="badge">0</span></h2>
            <p style="color:#999; font-size:13px; margin-bottom: 18px;">新成员注册后需你审核通过方可登录</p>
            <div id="pendingList"></div>
            <div class="msg" id="adminMsg"></div>
        </div>

        <!-- 关于 / 版本信息（与移动端「关于」弹窗内容一致：江夏政企客户管理平台 · 版本 1.0.0） -->
        <div class="card account-card" style="margin-top: 24px;">
            <h2 style="margin-bottom: 8px;">关于</h2>
            <div class="info-row">
                <span class="label">平台名称</span>
                <span class="value">江夏政企客户管理平台</span>
            </div>
            <div class="info-row">
                <span class="label">版本</span>
                <span class="value" id="appVersion">1.0.0</span>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v={{ static_ver }}"></script>
    <script>
        function setMsg(text, ok) {
            const el = document.getElementById("msg");
            el.textContent = text;
            el.className = "msg " + (ok ? "ok" : "err");
        }

        function setAdminMsg(text, ok) {
            const el = document.getElementById("adminMsg");
            el.textContent = text;
            el.className = "msg " + (ok ? "ok" : "err");
        }

        // 载入当前用户信息（含是否管理员），管理员显示审核面板
        (async function () {
            try {
                const resp = await fetch("/api/me");
                if (resp.status === 401) { window.location.href = "/login"; return; }
                const data = await resp.json();
                if (data.user && data.user.username) {
                    document.getElementById("username").textContent = data.user.username;
                    if (data.user.is_admin) {
                        document.getElementById("adminPanel").style.display = "block";
                        loadPending();
                    }
                }
            } catch (e) { /* 忽略 */ }
        })();

        async function loadPending() {
            const list = document.getElementById("pendingList");
            try {
                const resp = await fetch("/api/admin/pending");
                const data = await resp.json();
                const arr = data.pending || [];
                document.getElementById("pendingCount").textContent = arr.length;
                if (arr.length === 0) {
                    list.innerHTML = '<p style="color:#999;font-size:14px;">暂无待审核申请</p>';
                    return;
                }
                list.innerHTML = arr.map(u => `
                    <div class="pending-item">
                        <div>
                            <div class="p-phone">${u.username}</div>
                            <div class="p-time">申请时间：${u.created_at}</div>
                        </div>
                        <div class="p-actions">
                            <button class="btn-approve" onclick="approve(${u.id})">通过</button>
                            <button class="btn-reject" onclick="reject(${u.id})">拒绝</button>
                        </div>
                    </div>`).join("");
            } catch (e) {
                list.innerHTML = '<p style="color:#c0392b;font-size:14px;">加载失败，请刷新</p>';
            }
        }

        async function approve(id) {
            setAdminMsg("", true);
            try {
                const resp = await fetch("/api/admin/approve", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: id })
                });
                const data = await resp.json();
                setAdminMsg(data.message || data.error || "操作完成", resp.ok);
                if (resp.ok) loadPending();
            } catch (e) {
                setAdminMsg("网络错误，请重试", false);
            }
        }

        async function reject(id) {
            setAdminMsg("", true);
            try {
                const resp = await fetch("/api/admin/reject", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: id })
                });
                const data = await resp.json();
                setAdminMsg(data.message || data.error || "操作完成", resp.ok);
                if (resp.ok) loadPending();
            } catch (e) {
                setAdminMsg("网络错误，请重试", false);
            }
        }

        async function changePassword() {
            const oldPwd = document.getElementById("oldPwd").value;
            const newPwd = document.getElementById("newPwd").value;
            const confirmPwd = document.getElementById("confirmPwd").value;
            const btn = document.getElementById("saveBtn");
            setMsg("", true);

            if (!oldPwd || !newPwd) { setMsg("请填写当前密码与新密码", false); return; }
            if (newPwd.length < 6) { setMsg("新密码至少 6 位", false); return; }
            if (newPwd !== confirmPwd) { setMsg("两次输入的新密码不一致", false); return; }

            btn.disabled = true; btn.textContent = "保存中…";
            try {
                const resp = await fetch("/api/change-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
                });
                const data = await resp.json();
                if (resp.ok && data.ok) {
                    setMsg("密码修改成功", true);
                    document.getElementById("oldPwd").value = "";
                    document.getElementById("newPwd").value = "";
                    document.getElementById("confirmPwd").value = "";
                } else {
                    setMsg(data.error || "修改失败", false);
                }
            } catch (e) {
                setMsg("网络错误，请重试", false);
            }
            btn.disabled = false; btn.textContent = "保存修改";
        }
    </script>
</body>
</html>
